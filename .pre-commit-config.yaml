
    # .pre-commit-config.yaml
    repos:
      - repo: https://github.com/psf/black
        rev: 24.4.2 # Use the version of Black you want to enforce
        hooks:
          - id: black
            language_version: python3 # Use the version of Python you're using

      - repo: https://github.com/PyCQA/flake8
        rev: 7.0.0 # Use the version of Flake8 you want to enforce
        hooks:
          - id: flake8
            # You can pass arguments to flake8 here, e.g., to ignore specific errors
            # args: ["--ignore=E501,W503"]
